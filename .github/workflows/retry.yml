name: retry

# GitHub sometimes cancels jobs for lack of runner capacity (macOS most often). When a build run ends cancelled or failed,
# rerun only its failed or cancelled jobs, at most twice. A run dispatched with GITHUB_TOKEN (update.yml does this)
# still fires workflow_run when it finishes, because workflow_dispatch is exempt from the token's no-trigger rule.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions: {}

jobs:
  rerun:
    # run_attempt 1 and 2 get a rerun; attempt 3 is the last.
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Rerun failed and cancelled jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh run rerun "$RUN_ID" --failed
          echo "build run $RUN_ID attempt $ATTEMPT ended $CONCLUSION: reran its failed jobs (attempt $((ATTEMPT + 1)) of 3)." | tee -a "$GITHUB_STEP_SUMMARY"
